name: msnap
help: screenshot and screencast tool for mangowm
version: 0.6.1

commands:
- name: shot
  help: Take a screenshot
  dependencies:
    - grim
    - slurp
    - wl-copy
    - notify-send
  flags:
  - long: --region
    short: -r
    help: Take screenshot of selected region (interactive selection)
    conflicts: [--geometry, --window]
  - long: --geometry
    short: -g
    arg: x,y WxH
    help: Capture region with direct geometry
    conflicts: [--region, --window]
    validate: geometry_format
  - long: --pointer
    short: -p
    help: Include pointer in screenshot
  - long: --output
    short: -o
    arg: directory
    help: Output directory for screenshot
  - long: --filename
    short: -f
    arg: name
    help: Output filename for screenshot
  - long: --annotate
    short: -a
    help: Annotate the screenshot with Satty
  - long: --toplevel
    short: -t
    arg: identifier
    help: Capture window by foreign toplevel identifier
    conflicts: [--region, --geometry, --window]
  - long: --window
    short: -w
    help: Capture screenshot of the active window
    conflicts: [--region, --geometry, --toplevel]
  - long: --no-copy
    short: -n
    help: Skip copying screenshot to clipboard
  - long: --only-copy
    short: -c
    help: Copy screenshot to clipboard without saving file
  - long: --freeze
    short: -F
    help: Freeze the screen before taking screenshot

- name: cast
  help: Record the screen
  dependencies:
    - gpu-screen-recorder
    - ffmpeg
    - slurp
    - notify-send
  flags:
  - long: --portal
    short: -p
    help: Record a window via portal selection
    conflicts: [--region, --geometry]
  - long: --region
    short: -r
    help: Record selected region (interactive selection)
    conflicts: [--geometry]
  - long: --geometry
    short: -g
    arg: x,y WxH
    help: Record region with direct geometry
    conflicts: [--region]
    validate: geometry_format
  - long: --toggle
    short: -t
    help: Toggle recording on/off
    required: true
  - long: --output
    short: -o
    arg: directory
    help: Output directory for recording
  - long: --filename
    short: -f
    arg: name
    help: Output filename for recording
  - long: --audio
    short: -a
    help: Record system audio
  - long: --mic
    short: -m
    help: Record microphone
  - long: --audio-device
    short: -A
    arg: device
    help: System audio device (default - default_output)
  - long: --mic-device
    short: -M
    arg: device
    help: Microphone device (default - default_input)
  - long: --quality
    short: -q
    arg: level
    help: Video quality (medium, high, very_high, ultra)
  - long: --codec
    short: -k
    arg: codec
    help: Video codec (h264, hevc, av1, vp8, vp9)
  - long: --framerate
    short: -F
    arg: fps
    help: Target frame rate
  - long: --audio-codec
    short: -C
    arg: codec
    help: Audio codec (opus, aac)
  - long: --color-range
    short: -R
    arg: range
    help: Color range (limited, full)
  - long: --no-cursor
    help: Hide cursor in recording
  - long: --resolution
    short: -s
    arg: WxH
    help: Output resolution cap (e.g. 1920x1080)
  - long: --container
    short: -c
    arg: format
    help: Container format (mp4, mkv, webm)
  - long: --tune
    short: -T
    arg: tune
    help: Encoding tune (performance, quality)

- name: gui
  help: Launch the graphical interface
  dependencies:
    - qs
  flags:
  - long: --no-freeze
    help: Skip screen freeze (no wayfreeze)

- name: chooser
  help: Portal source chooser
  dependencies:
    - qs

- name: uninstall
  help: Uninstall msnap
  dependencies:
    - rm
  flags:
  - long: --force
    short: -f
    help: Skip confirmation prompt

- name: update
  help: Update msnap to the latest version
  dependencies:
    - curl
    - tar
    - git
  flags:
  - long: --check
    short: -c
    help: Check for updates without installing
  - long: --force
    short: -f
    help: Reinstall even if already up to date
  - long: --git
    short: -g
    help: Update from latest commit
    conflicts: [--check, --version]
  - long: --version
    short: -V
    arg: VERSION
    help: Install a specific version (e.g. x.x.x)
    conflicts: [--check, --git]
